<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexa Quant · Paper</title><style>body{margin:0;background:#0b1220;color:#e5edf7;font:16px system-ui;padding:24px;max-width:960px;margin:auto}h1{font-size:32px}.tag{color:#86efac}.card{background:#172235;border:1px solid #30405b;border-radius:16px;padding:20px;margin:12px 0}table{width:100%;border-collapse:collapse}td,th{padding:12px;border-bottom:1px solid #30405b;text-align:left}small{color:#9caec5}a{color:#93c5fd}</style></head><body><h1>Nexa Quant <span class="tag">PAPER ONLY</span></h1><p>Polymarket US · 只读市场监控 · 无真实下单</p><div class="card"><small>虚拟账户余额（尚未启用交易策略）</small><h1 id="cash">$1,000.00</h1><small id="scan">等待首次扫描</small></div><div class="card"><h2>市场报价</h2><div style="overflow:auto"><table><thead><tr><th>市场</th><th>买价 Bid</th><th>卖价 Ask</th></tr></thead><tbody id="rows"><tr><td colspan="3">尚无市场数据</td></tr></tbody></table></div></div><p><small>这是研究原型，不是收益承诺。行情可能延迟，未实现真实订单、AI 概率模型或完整模拟结算。</small></p><script>fetch('./data.json?ts='+Date.now()).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(d=>{document.getElementById('cash').textContent='$'+Number(d.cash||1000).toFixed(2);document.getElementById('scan').textContent=d.last_scan?'最近扫描：'+new Date(d.last_scan).toLocaleString()+' · 状态：'+(d.scan_status||'unknown')+' · 有效新报价：'+(d.diagnostics?.valid_quotes??0):'尚未扫描';if(d.markets?.length)document.getElementById('rows').innerHTML=d.markets.map(m=>'<tr><td>'+esc(m.title)+'</td><td>'+Number(m.bid).toFixed(3)+'</td><td>'+Number(m.ask).toFixed(3)+'</td></tr>').join('');if(!d.markets?.length)document.getElementById('rows').innerHTML='<tr><td colspan="3">暂无有效报价（'+esc(d.scan_status||'unknown')+'）；不会显示模拟行情</td></tr>'}).catch(e=>document.getElementById('scan').textContent='读取失败：'+e.message);function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
